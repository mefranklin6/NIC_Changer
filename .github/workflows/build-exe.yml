name: Build Windows executable

on:
  push:
    tags:
      - '*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing Git tag to build and publish
        required: true
        type: string

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  build:
    name: Build and publish tagged executable
    runs-on: windows-latest

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Prepare version information
        id: version
        shell: powershell
        run: |
          $tag = $env:RELEASE_TAG
          $safeTag = $tag -replace '[^0-9A-Za-z._-]', '-'
          if ([string]::IsNullOrWhiteSpace($safeTag)) {
              $safeTag = 'tagged-build'
          }

          $match = [regex]::Match($tag, '^v?(\d+)\.(\d+)\.(\d+)(?:\.(\d+))?$')
          if ($match.Success) {
              $revision = if ($match.Groups[4].Success) { $match.Groups[4].Value } else { '0' }
              $fileVersion = '{0}.{1}.{2}.{3}' -f $match.Groups[1].Value,
                  $match.Groups[2].Value, $match.Groups[3].Value, $revision
          }
          else {
              $fileVersion = '0.0.0.0'
              Write-Warning "Tag '$tag' is not a semantic version such as v2.1.0; using file version $fileVersion."
          }

          "safe_tag=$safeTag" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "file_version=$fileVersion" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Install PS2EXE
        shell: powershell
        run: Install-Module ps2exe -RequiredVersion 1.0.18 -Repository PSGallery -Scope CurrentUser -Force

      - name: Build executable
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $outputDirectory = Join-Path $PWD 'dist'
          $outputFile = Join-Path $outputDirectory 'NIC_Changer-${{ steps.version.outputs.safe_tag }}.exe'
          New-Item -ItemType Directory -Path $outputDirectory -Force | Out-Null

          Invoke-ps2exe `
              -inputFile (Join-Path $PWD 'NIC_Changer.ps1') `
              -outputFile $outputFile `
              -iconFile (Join-Path $PWD 'assets\nic-changer.ico') `
              -title 'NIC Changer' `
              -description 'Windows network tool for AV and IoT technicians' `
              -product 'NIC Changer' `
              -company 'California State University, Chico' `
              -version '${{ steps.version.outputs.file_version }}' `
              -noConsole `
              -STA `
              -DPIAware `
              -requireAdmin `
              -supportOS

          if (-not (Test-Path -LiteralPath $outputFile -PathType Leaf)) {
              throw "PS2EXE did not create $outputFile."
          }

          $hash = Get-FileHash -LiteralPath $outputFile -Algorithm SHA256
          $checksumFile = Join-Path $outputDirectory 'SHA256SUMS.txt'
          '{0}  {1}' -f $hash.Hash.ToLowerInvariant(), (Split-Path $outputFile -Leaf) |
              Set-Content -LiteralPath $checksumFile -Encoding ascii

      - name: Upload executable artifact
        uses: actions/upload-artifact@v7
        with:
          name: NIC-Changer-${{ steps.version.outputs.safe_tag }}-windows
          path: dist/
          if-no-files-found: error

      - name: Attach executable to GitHub Release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = $env:RELEASE_TAG
          $assets = @(
              (Resolve-Path 'dist\NIC_Changer-${{ steps.version.outputs.safe_tag }}.exe').Path
              (Resolve-Path 'dist\SHA256SUMS.txt').Path
          )

          # A missing release is expected on the first build for a tag. Windows
          # PowerShell 5.1 otherwise promotes gh's stderr output to a terminating
          # error because ErrorActionPreference is Stop.
          $savedErrorActionPreference = $ErrorActionPreference
          try {
              $ErrorActionPreference = 'SilentlyContinue'
              gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
              $releaseExists = $LASTEXITCODE -eq 0
          }
          finally {
              $ErrorActionPreference = $savedErrorActionPreference
          }

          if ($releaseExists) {
              gh release upload $tag @assets --clobber --repo $env:GITHUB_REPOSITORY
              if ($LASTEXITCODE -ne 0) {
                  throw "Unable to upload assets to the existing GitHub Release for $tag."
              }
          }
          else {
              gh release create $tag @assets `
                  --verify-tag `
                  --generate-notes `
                  --title "NIC Changer $tag" `
                  --repo $env:GITHUB_REPOSITORY
              if ($LASTEXITCODE -ne 0) {
                  throw "Unable to create the GitHub Release for $tag."
              }
          }
